[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[project]
name = "uns-client-tutorial"
version = "0.1.0"
description = "Agent Teams tutorial: parallel multi-protocol UNS collection client development"
requires-python = ">=3.11,<3.14"
dependencies = [
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3.3.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "asyncua>=1.1.0",
    "pymodbus>=3.13,<4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
