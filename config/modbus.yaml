broker:
  host: mqtt.plant-chicago.local
  port: 1883
  client_id: modbus_adapter_01

source:
  protocol: tcp          # tcp or rtu
  host: 192.168.10.50    # Modbus gateway IP
  port: 502
  unit_id: 1
  # RTU settings (unused for TCP):
  # serial_port: /dev/ttyUSB0
  # baudrate: 9600
  # parity: N

source_timezone: America/Chicago
stale_threshold_ms: 30000
poll_interval_ms: 1000

group_id: plant_chicago

register_map: contracts/register_map.csv

tags:
  - temperature_bearing_de
  - temperature_bearing_nde
  - vibration_x_motor_01
  - vibration_y_motor_01
  - pressure_inlet
  - pressure_outlet
  - flow_rate_main
  - motor_current
  - motor_running
  - valve_position_inlet
  - temperature_tank_01
  - level_tank_01
  - pressure_tank_01
  - agitator_speed
  - agitator_running
