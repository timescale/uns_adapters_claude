# Modbus-TCP client config — Plant Chicago, pump_042 + tank_101 (area_01)
#
# source.host/port match MODBUS_SOURCE_HOST/PORT in .env (simulated server).
# DB URL comes from TIMESCALE_SERVICE_URL in env — not configured here.

source:
  protocol: tcp
  host: localhost          # override via MODBUS_SOURCE_HOST
  port: 5020               # override via MODBUS_SOURCE_PORT
  unit_id: 1

source_timezone: America/Chicago
poll_interval_ms: 1000
register_map: contracts/register_map.csv

tags:
  # pump_042 (area_01/line_03) — Modbus client scope
  # tank_101 tags are collected via OPC UA (opcua_node_map.csv)
  - temperature_bearing_de
  - temperature_bearing_nde
  - vibration_x_motor_01
  - vibration_y_motor_01
  - pressure_inlet
  - pressure_outlet
  - flow_rate_main
  - motor_current
  - motor_running
  - valve_position_inlet
