# OPC UA client config — Plant Chicago, tank_101 (area_01) + oven_201 (area_02)
#
# source.endpoint matches OPCUA_SOURCE_HOST/PORT in .env (simulated server).
# namespace_uri is used to resolve ns_idx at runtime (do not hardcode ns=2).
# DB URL comes from TIMESCALE_SERVICE_URL in env — not configured here.

source:
  endpoint: "opc.tcp://localhost:4840/"   # override via OPCUA_SOURCE_HOST/PORT
  namespace_uri: "urn:plant-chicago:opcua:simulator"
  security_mode: None                      # Sign, SignAndEncrypt for production

source_timezone: America/Chicago
poll_interval_ms: 1000
node_map: contracts/opcua_node_map.csv

tags:
  - temperature_tank_01
  - level_tank_01
  - pressure_tank_01
  - agitator_speed
  - agitator_running
  - temperature_oven_zone_1
  - temperature_oven_zone_2
  - temperature_oven_zone_3
