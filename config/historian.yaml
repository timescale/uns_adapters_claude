broker:
  host: mqtt.plant-chicago.local
  port: 1883
  client_id: historian_adapter_01

source:
  type: osisoft_pi       # osisoft_pi, wonderware, ge_proficy
  host: pi-server.plant-chicago.local
  port: 5450
  database: piarchive
  # Authentication handled via OS-level trust or config

mode: live               # live or backfill
backfill:
  start: "2024-01-01T00:00:00"
  end: "2024-12-31T23:59:59"
  batch_size: 1000       # records per query
  rate_limit_ms: 100     # pause between batches

source_timezone: America/Chicago   # Historian stores local time!
stale_threshold_ms: 60000          # 60s — historians batch-write
poll_interval_ms: 5000             # 5s — historians don't update fast

group_id: plant_chicago

tag_map: contracts/historian_tag_map.csv

tags:
  - temperature_oven_zone_1
  - temperature_oven_zone_2
  - temperature_oven_zone_3
  - conveyor_speed
  - conveyor_running
